name: checks
on: [push, pull_request]
jobs:
  research-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e '.[dev,agent]'
      - run: python -m pytest -q
      - run: python -m last_mile --output runtime/ci-demo
